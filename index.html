<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz Master</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<header class="hero"><p class="eyebrow">TEST YOUR KNOWLEDGE</p><h1>Quiz Master</h1><p>Answer the questions, track your score, and improve.</p></header>
<section id="start-screen" class="panel"><h2>Ready to begin?</h2><p>This quiz has 5 multiple-choice questions.</p><label for="player-name">Your name (optional)</label><input id="player-name" type="text" maxlength="30" placeholder="Enter your name"><button id="start-button" class="primary">Start quiz</button></section>
<section id="quiz-screen" class="panel hidden" aria-live="polite"><div class="quiz-topline"><span id="question-count">Question 1 of 5</span><span id="score-label">Score: 0</span></div><div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div><h2 id="question-text">Question text</h2><div id="answers" class="answers"></div><p id="feedback" class="feedback" role="status"></p><button id="next-button" class="primary" disabled>Next question</button></section>
<section id="result-screen" class="panel hidden" aria-live="polite"><p class="eyebrow">QUIZ COMPLETE</p><h2 id="result-title">Great job!</h2><p id="result-score" class="result-score">You scored 0 out of 5.</p><p id="result-message"></p><button id="restart-button" class="primary">Try again</button></section>
<footer>Built with HTML · CSS · JavaScript</footer></main><script src="script.js"></script></body></html>
